[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-flow"
version = "0.1.0"
description = "A self-hosted, project-aware LLM gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "PyYAML>=6.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
encoder = ["torch>=2.2", "transformers>=4.40"]
kaggle = ["kaggle>=2.1.0"]
benchmarks = ["kaggle-benchmarks"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
atomic = "atomic_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atomic_flow = ["benchmark_data/*.json", "benchmark_data/fixtures/*.py"]
