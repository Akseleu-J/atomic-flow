[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-flow"
version = "0.2.0"
description = "A self-hosted, project-aware LLM gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.6", "PyYAML>=6.0", "pathspec>=0.12"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
encoder = ["numpy>=1.26", "torch>=2.2", "transformers>=4.40"]
kaggle = ["kaggle>=2.1.0"]
benchmarks = ["kaggle-benchmarks"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10", "fastapi>=0.110"]

[project.scripts]
atomic = "atomic_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atomic_flow = ["benchmark_data/*.json", "benchmark_data/fixtures/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["src/atomic_flow/benchmark_data/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "F541"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
