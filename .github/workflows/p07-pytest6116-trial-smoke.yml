name: P07 pytest6116 Twisted trial installation and ABI smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install . packaging==25.0
      - name: Run isolated Twisted trial smoke
        run: |
          mkdir -p p07-trial-smoke
          git rev-parse HEAD > p07-trial-smoke/tested-commit.txt
          python tools/p07_pytest6116_trial_smoke.py --output p07-trial-smoke/diagnostic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-pytest6116-trial-smoke-${{ github.sha }}
          path: p07-trial-smoke/
          retention-days: 14
          if-no-files-found: error
