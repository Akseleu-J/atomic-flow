name: P07 public obligation TaskRunner journey

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - name: Public source-bound failure repair and publication
        run: |
          mkdir -p p07-obligation-worker
          git rev-parse HEAD > p07-obligation-worker/tested-commit.txt
          python tools/p07_obligation_journey.py --output p07-obligation-worker/smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-obligation-journey-${{ github.sha }}
          path: p07-obligation-worker/
          retention-days: 14
          if-no-files-found: error
