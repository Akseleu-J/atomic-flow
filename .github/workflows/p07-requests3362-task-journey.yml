name: P07 private Requests3362 full TaskRunner journey

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]' swebench==3.0.15 packaging==25.0 cryptography==46.0.3
      - name: Provision exact private runtime and CN public certificates
        run: |
          mkdir -p p07-requests3362-task-worker
          git rev-parse HEAD > p07-requests3362-task-worker/tested-commit.txt
          python tools/p07_requests3362_legacy_image.py prepare --profile benchmarks/stage4/p07-requests-legacy-profile-v2.json --output /tmp/p07-requests3362-task-runtime
          python tools/p07_requests3362_legacy_image.py build --context /tmp/p07-requests3362-task-runtime --output p07-requests3362-task-worker/runtime
          python tools/p07_requests3362_cert_image.py prepare --runtime-receipt p07-requests3362-task-worker/runtime --output /tmp/p07-requests3362-task-cert
          python tools/p07_requests3362_cert_image.py build --context /tmp/p07-requests3362-task-cert --output p07-requests3362-task-worker/certificate
      - name: Independently qualify same-image HTTP TLS plugin health
        run: python tools/p07_requests3362_health.py --certificate-receipt p07-requests3362-task-worker/certificate --output p07-requests3362-task-worker/health
      - name: Root worker runs public TaskRunner failure replan repair final check and publication
        run: |
          sudo -- "$(command -v python)" tools/p07_requests3362_task_journey.py --certificate-receipt p07-requests3362-task-worker/certificate --health-receipt p07-requests3362-task-worker/health --output p07-requests3362-task-worker/journey
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-requests3362-task-${{ github.sha }}
          path: p07-requests3362-task-worker/
          retention-days: 14
          if-no-files-found: error
