name: P07 public Atomic and flat TaskRunner Docker safety journeys

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        arm: [atomic, flat]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - name: Scripted failure, host continuation, coupled repair and fresh final publication
        run: python tools/p07_flat_task_journey.py --arm ${{ matrix.arm }} --output p07-matched-public-worker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-matched-public-${{ matrix.arm }}-${{ github.sha }}
          path: p07-matched-public-worker/
          retention-days: 14
          if-no-files-found: error
