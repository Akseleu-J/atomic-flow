name: P07 SymPy13971 complete legacy calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install swebench==3.0.15 packaging==25.0
      - name: Build and independently qualify private runtime
        run: |
          mkdir -p p07-sympy13971-worker
          git rev-parse HEAD > p07-sympy13971-worker/tested-commit.txt
          python tools/p07_legacy_transplant.py prepare --output /tmp/p07-sympy-transplant
          python tools/p07_legacy_transplant.py build --context /tmp/p07-sympy-transplant --output p07-sympy13971-worker/transplant
          python tools/p07_sympy13971_image.py prepare --profile benchmarks/stage4/p07-sympy13971-runtime-profile.json --transplant-receipt p07-sympy13971-worker/transplant --output /tmp/p07-sympy-mpmath
          python tools/p07_sympy13971_image.py build --context /tmp/p07-sympy-mpmath --output p07-sympy13971-worker/runtime
      - name: Run native base gold wrong with all protected requirements
        run: |
          IMAGE=$(python -c "import json; print(json.load(open('p07-sympy13971-worker/runtime/sympy-runtime.json'))['image_id'])")
          python tools/p07_sympy13971_calibrate.py --image "$IMAGE" --runtime-receipt p07-sympy13971-worker/runtime --runtime-profile benchmarks/stage4/p07-sympy13971-runtime-profile.json --output p07-sympy13971-worker/calibration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-sympy13971-legacy-${{ github.sha }}
          path: p07-sympy13971-worker/
          retention-days: 14
          if-no-files-found: error
