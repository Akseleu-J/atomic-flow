name: P07 full-source scripted native SymPy TaskRunner journey

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        verify_method: [ordinary_test, pytest]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - name: Native ordinary failure replan repair and scoped publication
        run: |
          mkdir -p p07-sympy-task-worker
          git rev-parse HEAD > p07-sympy-task-worker/tested-commit.txt
          python tools/p07_sympy_task_journey.py --verify-method ${{ matrix.verify_method }} --output p07-sympy-task-worker/smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-sympy-task-journey-${{ matrix.verify_method }}-${{ github.sha }}
          path: p07-sympy-task-worker/
          retention-days: 14
          if-no-files-found: error
