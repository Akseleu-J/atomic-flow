name: P07 Requests2674 private pytest synthetic smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]' swebench==3.0.15 packaging==25.0 cryptography==46.0.3
      - name: Build admitted historical runtime and run synthetic bootstrap
        run: |
          mkdir -p p07-python27-bootstrap-worker
          git rev-parse HEAD > p07-python27-bootstrap-worker/tested-commit.txt
          python tools/p07_requests2674_python27_image.py prepare --task psf__requests-2674 --output /tmp/p07-2674-bootstrap-runtime
          python tools/p07_requests2674_python27_image.py build --context /tmp/p07-2674-bootstrap-runtime --output p07-python27-bootstrap-worker/runtime
          sudo -- "$(command -v python)" tools/p07_requests2674_private_pytest_smoke.py --runtime-receipt p07-python27-bootstrap-worker/runtime --output p07-python27-bootstrap-worker/smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-2674-private-pytest-${{ github.sha }}
          path: p07-python27-bootstrap-worker/
          retention-days: 14
          if-no-files-found: error
