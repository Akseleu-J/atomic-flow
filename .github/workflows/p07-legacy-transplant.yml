name: P07 private legacy runtime transplant qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Build private runtime and verify source, ABI and standard library
        run: |
          mkdir -p p07-transplant-worker
          git rev-parse HEAD > p07-transplant-worker/tested-commit.txt
          python tools/p07_legacy_transplant.py prepare --output /tmp/p07-transplant-context
          python tools/p07_legacy_transplant.py build --context /tmp/p07-transplant-context --output p07-transplant-worker/qualification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-legacy-transplant-${{ github.sha }}
          path: p07-transplant-worker/
          retention-days: 14
          if-no-files-found: error
