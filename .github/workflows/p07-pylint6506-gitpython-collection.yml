name: P07 Pylint6506 GitPython derived collection diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install . packaging==25.0
      - name: Audit wheels and collect in restricted derived image
        run: |
          mkdir -p p07-pylint-gitpython
          git rev-parse HEAD > p07-pylint-gitpython/tested-commit.txt
          python tools/p07_pylint6506_gitpython_collection.py --output p07-pylint-gitpython/diagnostic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-pylint6506-gitpython-collection-${{ github.sha }}
          path: p07-pylint-gitpython/
          retention-days: 14
          if-no-files-found: error
