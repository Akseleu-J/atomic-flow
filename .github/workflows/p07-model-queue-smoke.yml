name: P07 scripted zero-provider GitHub model queue roundtrip

on:
  workflow_dispatch:
    inputs:
      queue_branch:
        description: Reviewed data-only scratch branch
        required: true
        type: string

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - name: Request scripted roundtrip from host broker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUEUE_BRANCH: ${{ inputs.queue_branch }}
        run: python tools/p07_model_queue_smoke.py --queue-branch "$QUEUE_BRANCH" --output p07-queue-worker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-scripted-model-queue-${{ github.sha }}
          path: p07-queue-worker/
          retention-days: 14
          if-no-files-found: error
