name: P07 Requests3362 complete legacy calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install swebench==3.0.15 packaging==25.0 cryptography==46.0.3
      - name: Build and qualify source-free historical dependencies
        run: |
          mkdir -p p07-requests3362-runtime-worker
          git rev-parse HEAD > p07-requests3362-runtime-worker/tested-commit.txt
          python tools/p07_requests3362_legacy_image.py prepare --output /tmp/p07-requests3362-runtime
          python tools/p07_requests3362_legacy_image.py build --context /tmp/p07-requests3362-runtime --output p07-requests3362-runtime-worker/runtime
      - name: Build disclosed CN-only fixture certificate overlay
        run: |
          python tools/p07_requests3362_cert_image.py prepare --runtime-receipt p07-requests3362-runtime-worker/runtime --output /tmp/p07-requests3362-cert
          python tools/p07_requests3362_cert_image.py build --context /tmp/p07-requests3362-cert --output p07-requests3362-runtime-worker/certificate
      - name: Qualify actual HTTP HTTPS and legacy plugins
        run: python tools/p07_requests3362_health.py --certificate-receipt p07-requests3362-runtime-worker/certificate --output p07-requests3362-runtime-worker/health
      - name: Install trusted host namespace tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables util-linux
      - name: Run complete native base gold wrong
        run: |
          sudo -n "$(command -v python)" tools/p07_requests3362_calibrate.py --certificate-receipt p07-requests3362-runtime-worker/certificate --health-receipt p07-requests3362-runtime-worker/health --output p07-requests3362-runtime-worker/calibration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-requests3362-calibration-${{ github.sha }}
          path: p07-requests3362-runtime-worker/
          retention-days: 14
          if-no-files-found: error
