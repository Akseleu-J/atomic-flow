name: P07 Sphinx7738 public execution diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - name: Execute full public tests in bounded worker
        run: |
          mkdir -p p07-sphinx7738-execution
          git rev-parse HEAD > p07-sphinx7738-execution/tested-commit.txt
          python tools/p07_sphinx7738_public_execution.py --output p07-sphinx7738-execution/diagnostic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-sphinx7738-execution-${{ github.sha }}
          path: p07-sphinx7738-execution/
          retention-days: 14
          if-no-files-found: error
