name: P07 hermetic timeout topology qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install trusted host namespace tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables util-linux
      - name: Qualify fixed synthetic loopback and timeout topology
        run: |
          mkdir -p p07-timeout-worker
          git rev-parse HEAD > p07-timeout-worker/tested-commit.txt
          sudo -n "$(command -v python)" tools/p07_timeout_topology_probe.py --output p07-timeout-worker/probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-timeout-topology-${{ github.sha }}
          path: p07-timeout-worker/
          retention-days: 14
          if-no-files-found: error
