name: P07 real CheckSpec executor boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - name: Confirm real pass, assertion failure and required-skip boundaries
        run: |
          mkdir -p p07-check-spec-worker
          git rev-parse HEAD > p07-check-spec-worker/tested-commit.txt
          python tools/p07_check_spec_smoke.py --output p07-check-spec-worker/smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-check-spec-executor-${{ github.sha }}
          path: p07-check-spec-worker/
          retention-days: 14
          if-no-files-found: error
