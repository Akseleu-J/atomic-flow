name: P07 three Requests function-suite CA qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: [psf__requests-1963, psf__requests-2148, psf__requests-2317]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install swebench==3.0.15 packaging==25.0 cryptography==46.0.3
      - name: Build independently admitted own-base runtime
        run: |
          mkdir -p p07-function-worker
          git rev-parse HEAD > p07-function-worker/tested-commit.txt
          python tools/p07_requests_function_image.py prepare --task "${{ matrix.task }}" --output /tmp/p07-function-context
          python tools/p07_requests_function_image.py build --context /tmp/p07-function-context --output p07-function-worker/runtime
      - name: Install trusted host namespace tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables util-linux
      - name: Complete native base gold wrong with real services
        run: sudo -n "$(command -v python)" tools/p07_requests_function_calibrate.py --runtime-receipt p07-function-worker/runtime --output p07-function-worker/calibration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-function-${{ matrix.task }}-${{ github.sha }}
          path: p07-function-worker/
          retention-days: 14
          if-no-files-found: error
