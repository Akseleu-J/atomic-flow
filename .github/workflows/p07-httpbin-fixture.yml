name: P07 real HTTPBin fixture image acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/p07_httpbin_fixture.py'
      - 'tools/p07_httpbin_pytest.py'
      - 'tools/prepare_p07_httpbin_image.py'
      - 'tools/p07_requests_fixture_calibrate.py'
      - 'benchmarks/stage4/httpbin-fixture-requirements.lock'
      - '.github/workflows/p07-httpbin-fixture.yml'

permissions:
  contents: read

jobs:
  real-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install . packaging==25.0
      - name: Prepare reviewed wheel bytes without executing target code
        run: |
          mkdir -p p07-httpbin-worker
          git rev-parse HEAD > p07-httpbin-worker/tested-commit.txt
          python tools/prepare_p07_httpbin_image.py --image swebench/sweb.eval.x86_64.psf_1776_requests-3362@sha256:c5dc4ba64a2d97d6cff6b82fe9c0561589df13f23df6883d05e99b630942bbd1 --output /tmp/p07-httpbin-context
          cp /tmp/p07-httpbin-context/preparation.json /tmp/p07-httpbin-context/fixture-lock.build.json /tmp/p07-httpbin-context/requirements.lock p07-httpbin-worker/
          cmp benchmarks/stage4/httpbin-fixture-requirements.lock /tmp/p07-httpbin-context/requirements.lock
      - name: Build trusted fixture layer and prove network-none real HTTP and HTTPS
        run: python tools/p07_requests_fixture_calibrate.py --context /tmp/p07-httpbin-context --output p07-httpbin-worker/build-probe --task psf__requests-3362
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-httpbin-fixture-${{ github.sha }}
          path: p07-httpbin-worker/
          retention-days: 14
          if-no-files-found: error
