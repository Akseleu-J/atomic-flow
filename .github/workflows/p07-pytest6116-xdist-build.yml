name: P07 xdist offline double build diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install . packaging==25.0
      - name: Build twice in isolated containers
        run: |
          mkdir -p p07-xdist-worker
          git rev-parse HEAD > p07-xdist-worker/tested-commit.txt
          python tools/p07_pytest6116_xdist_build.py --output p07-xdist-worker/diagnostic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-pytest6116-xdist-build-${{ github.sha }}
          path: p07-xdist-worker/
          retention-days: 14
          if-no-files-found: error
