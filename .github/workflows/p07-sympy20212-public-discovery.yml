name: P07 SymPy20212 native public file discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - name: Compare native file discovery with fixed public Git inventory
        run: |
          mkdir -p p07-sympy20212-discovery
          git rev-parse HEAD > p07-sympy20212-discovery/tested-commit.txt
          python tools/p07_sympy20212_public_discovery.py --output p07-sympy20212-discovery/observation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p07-sympy20212-discovery-${{ github.sha }}
          path: p07-sympy20212-discovery/
          retention-days: 14
          if-no-files-found: error
