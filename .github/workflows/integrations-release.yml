name: External interoperability and installed release

on:
  push:
    branches: [main, experimental, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed:
    name: Wheel ${{ matrix.os }} Python ${{ matrix.python }} ${{ matrix.extra }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ['3.11', '3.12']
        extra: [core, api]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build==1.3.0
      - run: python tools/release_acceptance.py --extra ${{ matrix.extra }} --output release-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.extra }}-${{ github.sha }}
          path: release-evidence/

  external:
    name: Real reviewed task, notebook and recovery composition
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: P07 broker, scripted proxy and fixed-budget ledger contracts
        run: node --test tests/p07_model_broker_test.mjs tests/p07_scripted_task_proxy_test.mjs tests/p07_paid_campaign_ledger_test.mjs tests/p07_kaggle_proxy_adapter_test.mjs tests/p07_github_checkpoint_store_test.mjs tests/p07_checkpoint_store_smoke_test.mjs
      # Install the selected runtime explicitly; npx implicit downloads stay off.
      - name: Install explicitly pinned public acceptance tools
        shell: bash
        run: |
          mkdir -p external-evidence external-tools
          git rev-parse HEAD > external-evidence/tested-commit.txt
          python -m pip install . -r requirements/acceptance.txt
          python -m pip freeze --all > external-evidence/python-freeze.txt
          node --version > external-evidence/node-version.txt
          node -e "if(Number(process.versions.node.split('.')[0]) < 24) process.exit(1)"
          npm install --prefix external-tools --ignore-scripts --engine-strict --save-exact @modelcontextprotocol/server-filesystem@2.0.0
          cp external-tools/package-lock.json external-evidence/npm-package-lock.json
          npm ls --prefix external-tools --all --json > external-evidence/npm-tree.json
      - name: Run actual source-server and analyzer task
        shell: bash
        env:
          ATOMIC_FLOW_EXECUTION_MODE: local
        run: |
          python tools/integration_acceptance.py --pylsp "$(command -v pylsp)" --node "$(command -v node)" --mcp-server "$GITHUB_WORKSPACE/external-tools/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js" --output external-evidence/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: external-interoperability-${{ github.sha }}
          path: external-evidence/
